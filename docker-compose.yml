services:
  postgres:
    image: postgres:16
    container_name: tripster-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: tripster_db
      TZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - tripster-postgres-data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: adminer_container
    restart: unless-stopped
    ports:
      - "7070:8080"
    depends_on:
      - postgres

volumes:
  tripster-postgres-data: